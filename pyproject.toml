[build-system]
requires = ['poetry-core>=1.2.0', 'wheel',]
build-backend = 'poetry.core.masonry.api'

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = "^8.3.5"
pytest-skip-slow = "^0.0.5"
responses = "^0.25.7"

[tool.pytest.ini_options]
minversion = '6.0'
addopts = """
--doctest-modules \
--ignore=docs/
"""
testpaths = [
    'tests',
]